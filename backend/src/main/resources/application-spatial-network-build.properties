# Activated only via SPRING_PROFILES_ACTIVE=spatial-network-build. Runs the one-shot Derived
# Network Layer builder (com.season.semiproject.spatial.network.NetworkBuildRunner) and exits --
# never starts a web server, so it cannot conflict with a normally-running
# `./mvnw spring-boot:run` instance on the same port, and never runs during normal startup.
spring.main.web-application-type=none
