# Activated only via SPRING_PROFILES_ACTIVE=spatial-import. Runs the one-shot Raw Spatial
# Layer importer (com.season.semiproject.spatial.SpatialImportRunner) and exits -- never starts
# a web server, so it cannot conflict with a normally-running `./mvnw spring-boot:run` instance
# on the same port, and never runs during normal application startup.
spring.main.web-application-type=none
