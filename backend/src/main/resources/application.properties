spring.application.name=semiproject

# PostgreSQL (Docker, see docker-compose.yml at repo root). Values come from environment
# variables so no credential is hardcoded here; export the repo-root .env before running
# (e.g. `set -a; source ../.env; set +a` from backend/, or via your IDE run configuration).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# port번호
server.port=9000
# mybatis
mybatis.mapper-locations=classpath:mapper/mapper-*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# 로거 -> 디버깅할때 풀어서 사용
# mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB